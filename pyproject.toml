[project]
name = "cellblock"
version = "0.1.0"
description = "Code-execution sandboxes for AI agents (Docker-backed MVP, microVM-ready seam)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "docker>=7.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
examples = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
cellblock = "cellblock.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellblock", "src/cellblock_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["docker: needs a running Docker daemon"]
